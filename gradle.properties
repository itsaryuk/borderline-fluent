org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Languages held back from the release (owner, 2026-10-15: their story and UI text has had no native-speaker check).
# Their code, content, translations, packs and benches stay in the repo; this one list keeps them out of the game
# (Language.shipped via BuildConfig), the bundle (asset packs, UI locales: app/build.gradle.kts) and the fetched Piper
# voices (scripts/fetch-models.sh). To bring one back: drop it here, add it to res/xml/locales_config.xml
# (LocalesConfigTest checks the two agree) and update the store copy (play/). -PheldBackLanguages= builds with all.
heldBackLanguages=ar,tr,zh
